     pages/mesas/mesa-add.html
     ====================================================== -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Sense RPG | Nova Mesa</title>

    <link rel="stylesheet" href="../../static/css/style.css">
</head>

<body>

    <div class="app-layout">

        <!-- =============================================
             SIDEBAR
             ============================================= -->
        <aside class="sidebar">

            <div class="sidebar-brand">

                <div class="sidebar-logo">
                    StorySense
                </div>

                <h1 class="sidebar-title">
                    Story Sense
                </h1>

                <p class="sidebar-description">
                    Painel do mestre
                </p>

            </div>

            <p class="sidebar-section-title">
                Navegação
            </p>

            <nav class="sidebar-nav">

                <a href="../../dashboard.html" class="sidebar-link">
                    <span class="sidebar-link-icon">📊</span>
                    <span>Dashboard</span>
                </a>

                <a href="mesa-list.html" class="sidebar-link active">
                    <span class="sidebar-link-icon">🎲</span>
                    <span>Mesas</span>
                </a>

                <a href="../jogadores/jogador-list.html" class="sidebar-link">
                    <span class="sidebar-link-icon">👥</span>
                    <span>Jogadores</span>
                </a>

                <a href="../consentimento/consentimento.html" class="sidebar-link">
                    <span class="sidebar-link-icon">📄</span>
                    <span>Consentimentos</span>
                </a>

                <a href="../analise/escuta.html" class="sidebar-link">
                    <span class="sidebar-link-icon">🧠</span>
                    <span>Análises</span>
                </a>

                <a href="../gerador/gerador.html" class="sidebar-link">
                    <span class="sidebar-link-icon">✨</span>
                    <span>Gerador</span>
                </a>

                <a href="../oneshot/oneshot-list.html" class="sidebar-link">
                    <span class="sidebar-link-icon">🕯️</span>
                    <span>One-Shots</span>
                </a>

                <a href="../revisao/revisao.html" class="sidebar-link">
                    <span class="sidebar-link-icon">✍️</span>
                    <span>Revisão</span>
                </a>

                <a href="../configuracoes/configuracoes.html" class="sidebar-link">
                    <span class="sidebar-link-icon">⚙️</span>
                    <span>Configurações</span>
                </a>

            </nav>

        </aside>


        <!-- =============================================
             CONTEÚDO
             ============================================= -->
        <main class="main-content">

            <!-- =========================================
                 TOPBAR
                 ========================================= -->
            <header class="topbar">

                <div class="search-box">

                    <span>🔎</span>

                    <input
                        type="search"
                        placeholder="Buscar..."
                    >

                </div>

                <div class="topbar-actions">

                    <a href="mesa-list.html" class="btn btn-outline btn-sm">
                        Voltar
                    </a>

                    <a href="../../login.html" class="btn btn-outline btn-sm">
                        Sair
                    </a>

                </div>

            </header>


            <!-- =========================================
                 HEADER
                 ========================================= -->
            <section class="page-container">

                <div class="page-header">

                    <small>
                        Mesas
                    </small>

                    <h2 class="page-title">
                        Nova Mesa
                    </h2>

                    <p class="page-subtitle">
                        Cadastre uma nova campanha ou sessão.
                    </p>

                </div>


                <!-- =====================================
                     FORMULÁRIO
                     ===================================== -->
                <section class="card">

                    <form class="form">

                        <!-- =============================
                             PRIMEIRA LINHA
                             ============================= -->
                        <div class="form-row">

                            <div class="form-group">

                                <label class="form-label">
                                    Nome da Mesa
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Digite o nome da mesa"
                                >

                            </div>


                            <div class="form-group">

                                <label class="form-label">
                                    Sistema
                                </label>

                                <select class="form-select">

                                    <option>
                                        Selecione
                                    </option>

                                    <option>
                                        D&D 5e
                                    </option>

                                    <option>
                                        Tormenta 20
                                    </option>

                                    <option>
                                        Ordem Paranormal
                                    </option>

                                    <option>
                                        Call of Cthulhu
                                    </option>

                                    <option>
                                        Cyberpunk RED
                                    </option>

                                </select>

                            </div>

                        </div>


                        <!-- =============================
                             SEGUNDA LINHA
                             ============================= -->
                        <div class="form-row">

                            <div class="form-group">

                                <label class="form-label">
                                    Mestre
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Nome do mestre"
                                >

                            </div>


                            <div class="form-group">

                                <label class="form-label">
                                    Quantidade de jogadores
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    placeholder="0"
                                >

                            </div>

                        </div>


                        <!-- =============================
                             DESCRIÇÃO
                             ============================= -->
                        <div class="form-group">

                            <label class="form-label">
                                Descrição
                            </label>

                            <textarea
                                class="form-textarea"
                                placeholder="Descreva a proposta da mesa..."
                            ></textarea>

                        </div>


                        <!-- =============================
                             TEMA
                             ============================= -->
                        <div class="form-row">

                            <div class="form-group">

                                <label class="form-label">
                                    Tema principal
                                </label>

                                <select class="form-select">

                                    <option>
                                        Selecione
                                    </option>

                                    <option>
                                        Fantasia
                                    </option>

                                    <option>
                                        Horror
                                    </option>

                                    <option>
                                        Investigação
                                    </option>

                                    <option>
                                        Cyberpunk
                                    </option>

                                    <option>
                                        Pós-apocalíptico
                                    </option>

                                </select>

                            </div>


                            <div class="form-group">

                                <label class="form-label">
                                    Status
                                </label>

                                <select class="form-select">

                                    <option>
                                        Ativa
                                    </option>

                                    <option>
                                        Preparação
                                    </option>

                                    <option>
                                        Pausada
                                    </option>

                                    <option>
                                        Finalizada
                                    </option>

                                </select>

                            </div>

                        </div>


                        <!-- =============================
                             CHECKBOXES
                             ============================= -->
                        <div class="grid">

                            <label class="checkbox-card">

                                <input type="checkbox">

                                <span>
                                    Permitir geração automática de conteúdo
                                </span>

                            </label>


                            <label class="checkbox-card">

                                <input type="checkbox">

                                <span>
                                    Habilitar análise narrativa dos jogadores
                                </span>

                            </label>

                        </div>


                        <!-- =============================
                             BOTÕES
                             ============================= -->
                        <div class="topbar-actions mt-xl">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Salvar Mesa
                            </button>

                            <a
                                href="mesa-list.html"
                                class="btn btn-outline"
                            >
                                Cancelar
                            </a>

                        </div>

                    </form>

                </section>

            </section>

        </main>

    </div>

</body>
</html>
